<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Clock</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body
    class="bg-black text-white h-screen flex flex-col justify-center items-center select-none p-4"
  >
    <div class="flex items-baseline justify-center font-digital">
      <div
        id="clock"
        class="text-7xl sm:text-8xl md:text-9xl tracking-widest font-medium glow-text"
      >
        00:00:00
      </div>
      <div
        id="ampm"
        class="text-xl sm:text-2xl md:text-3xl ml-4 font-text text-gray-400 font-medium tracking-wide uppercase hidden"
      >
        --
      </div>
    </div>

    <div
      id="date"
      class="font-text text-gray-400 text-base sm:text-lg md:text-xl font-normal tracking-wide mt-4 mb-10"
    >
      Date
    </div>

    <button
      id="toggleBtn"
      class="font-text px-4 py-2 bg-zinc-900 border border-zinc-800 hover:border-zinc-700 active:scale-95 text-zinc-300 text-sm font-medium rounded-lg shadow-md transition-all duration-200"
    >
      Switch to 12-Hour Format
    </button>

    <script src="script.js"></script>
  </body>
</html>
